[package]
name = "sps"
version = "0.1.0"
description = "An App for Diagnosing Performance Issues in SDP OP"
authors = ["Dinesh Kumar G <dinesh.gv@zohocorp.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sps_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1.10505.0", features = ["appender-arrow", "bundled", "r2d2"] }
tracing = { version = "0.1.44", features = ["log"] }
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive", "env"] }
time = { version = "0.3.55", features = ["parsing"] }
memmap2 = "0.9.11"
r2d2 = "0.8.10"
mimalloc = { version = "0.1.52", features = ["extended", "v2"] }
tracing-subscriber = "0.3.23"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
incremental = false

[profile.dev]
incremental = true
strip = false
