# Rolling release: every push to main rebuilds the "latest" prerelease with
# fresh dmg / msi bundles plus deb/rpm/AppImage PER Ubuntu baseline
# (suffixed _ubuntu-22.04 / _ubuntu-24.04 — pick the one matching your host).
#
# Design notes:
#  - The auto-injected GITHUB_TOKEN is read-only by default on new repos;
#    `permissions: contents: write` is what allows creating releases.
#  - The old release is deleted first (single job, before the matrix) because
#    the app version rarely changes — re-uploading identically named assets
#    to an existing release fails.
#  - --bundles overrides tauri.conf.json's targets per platform, so each
#    runner only builds its native formats.
#  - macos-latest is Apple Silicon; the dmg is aarch64-only. Add a second
#    macos entry with `args: --target x86_64-apple-darwin --bundles dmg`
#    if Intel Macs need to be served.
#  - Bundles are unsigned: macOS users right-click -> Open the first time,
#    Windows shows a SmartScreen notice. Signing requires paid certificates.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: drop previous rolling release
        run: gh release delete latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: refresh-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          # BOTH Ubuntu baselines, deliberately: a bundle built on 22.04
          # (GLib 2.72) breaks on 24.04 hosts ("undefined symbol:
          # g_task_set_static_name" from newer gvfs modules) and vice versa
          # for baseline libs — so each supported distro gets its own
          # artifacts, suffixed by builder (see the upload step). 20.04
          # runners are retired; 22.04 + 24.04 is the full hosted set.
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: ubuntu-24.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # The app lives in the sps/ subdirectory of the repo, so every
      # path-sensitive step below must point there explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: sps/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # Caches target/ per platform; cuts warm builds down dramatically.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: sps/src-tauri

      - name: install linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
        working-directory: sps

      # macOS/Windows: tauri-action builds AND uploads straight into the
      # release (their filenames never collide across jobs).
      - uses: tauri-apps/tauri-action@v0
        if: ${{ !startsWith(matrix.platform, 'ubuntu') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sps
          tagName: latest
          releaseName: sps latest (main)
          releaseBody: Rolling build of the newest commit on main.
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

      # Linux: build ONLY — both distro jobs produce identically named
      # files (sps_0.1.0_amd64.deb), so we rename with the builder suffix
      # and upload ourselves.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(matrix.platform, 'ubuntu')
        with:
          projectPath: sps
          args: --bundles ${{ matrix.bundles }}

      - name: upload linux bundles (distro-suffixed)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          shopt -s nullglob
          mkdir -p out
          for f in sps/src-tauri/target/release/bundle/deb/*.deb \
                   sps/src-tauri/target/release/bundle/rpm/*.rpm \
                   sps/src-tauri/target/release/bundle/appimage/*.AppImage; do
            base="$(basename "$f")"
            cp "$f" "out/${base%.*}_${{ matrix.platform }}.${base##*.}"
          done
          # the release may not exist yet (created by whichever job gets
          # there first; concurrent creates collapse into the || true)
          gh release create latest --prerelease --title "sps latest (main)" \
            --notes "Rolling build of the newest commit on main." 2>/dev/null || true
          gh release upload latest out/* --clobber
