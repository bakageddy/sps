# Tagged releases: pushing a tag like v2026.09.26 builds every bundle and
# publishes them as the GitHub release for that tag — dmg (macOS), msi
# (Windows), deb + AppImage PER Ubuntu baseline (suffixed _ubuntu-22.04 /
# _ubuntu-24.04 — pick the one matching your host), and an rpm built in a
# real Fedora container (suffixed _fedora-42).
#
# Design notes:
#  - Releases are cut by TAG, not by pushes to main: main can move freely;
#    a release is a deliberate `git tag vYYYY.MM.DD && git push --tags`.
#    Every job releases under `github.ref_name` (the tag), so all bundles
#    land in one release and nothing needs deleting first.
#  - The auto-injected GITHUB_TOKEN is read-only by default on new repos;
#    `permissions: contents: write` is what allows creating releases.
#  - rust-cache gets a PER-MATRIX-LEG key. Both Ubuntu legs share the job
#    name, so the default key made them share one cache: 24.04's target/
#    restored onto 22.04, where the -sys build scripts had baked a different
#    system webkit/gtk version into rustc's metadata hash. cargo's
#    fingerprints don't track system libraries, so it believed `tauri` was
#    fresh and rustc then failed with "E0463 can't find crate for `tauri`".
#    Distinct keys = distinct caches; those legs must never share artifacts.
#  - BOTH Ubuntu baselines on purpose: a bundle built on 22.04 (GLib 2.72)
#    breaks on 24.04 hosts ("undefined symbol: g_task_set_static_name" from
#    newer gvfs modules) and vice versa — each distro generation gets its
#    own artifacts. 20.04 runners are retired.
#  - An rpm built on Ubuntu links against Ubuntu libs/package names and is
#    useless on Fedora — the rpm job runs in a fedora container instead.
#  - gh in EVERY upload step gets GH_REPO + safe.directory: inside a
#    container the checkout is owned by a different uid, and gh shelling
#    out to git dies with "dubious ownership" otherwise.
#  - macos-latest is Apple Silicon; the dmg is aarch64-only. Add a second
#    macos entry with `args: --target x86_64-apple-darwin --bundles dmg`
#    if Intel Macs need to be served.
#  - Bundles are unsigned: macOS users right-click -> Open the first time,
#    Windows shows a SmartScreen notice. Signing requires paid certificates.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: ubuntu-24.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # The app lives in the sps/ subdirectory of the repo, so every
      # path-sensitive step below must point there explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: sps/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # Caches target/ per platform. `key` keeps each matrix leg's cache
      # separate — see the design notes for the E0463 this prevents.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: sps/src-tauri
          key: ${{ matrix.platform }}

      - name: install linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
        working-directory: sps

      # macOS/Windows: tauri-action builds AND uploads straight into the
      # tag's release (their filenames never collide across jobs).
      - uses: tauri-apps/tauri-action@v0
        if: ${{ !startsWith(matrix.platform, 'ubuntu') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sps
          tagName: ${{ github.ref_name }}
          releaseName: sps ${{ github.ref_name }}
          releaseBody: See the commits since the previous tag for what changed.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      # Linux: build ONLY — both distro jobs produce identically named
      # files (sps_0.1.0_amd64.deb), so we rename with the builder suffix
      # and upload ourselves.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(matrix.platform, 'ubuntu')
        with:
          projectPath: sps
          args: --bundles ${{ matrix.bundles }}

      - name: upload linux bundles (distro-suffixed)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          shopt -s nullglob
          mkdir -p out
          for f in sps/src-tauri/target/release/bundle/deb/*.deb \
                   sps/src-tauri/target/release/bundle/appimage/*.AppImage; do
            base="$(basename "$f")"
            cp "$f" "out/${base%.*}_${{ matrix.platform }}.${base##*.}"
          done
          # the release may not exist yet (created by whichever job gets
          # there first; concurrent creates collapse into the || true)
          gh release create "$TAG" --verify-tag --title "sps $TAG" \
            --notes "See the commits since the previous tag for what changed." 2>/dev/null || true
          gh release upload "$TAG" out/* --clobber

  # A real Fedora RPM must be BUILT on Fedora: same runner, fedora container.
  build-fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: install system deps
        run: |
          dnf install -y git rust cargo nodejs npm gh \
            webkit2gtk4.1-devel openssl-devel gtk3-devel \
            libappindicator-gtk3-devel librsvg2-devel \
            gcc gcc-c++ make file wget xz

      - uses: actions/checkout@v4

      - name: install pnpm + frontend deps
        run: |
          npm install -g pnpm@11
          pnpm --dir sps install --frozen-lockfile

      - name: build rpm
        run: pnpm --dir sps tauri build --bundles rpm

      - name: upload fedora rpm (suffixed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repo from this env var instead of shelling out
          # to git — which would die on the container's uid mismatch with
          # "detected dubious ownership in repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # belt and braces for anything else that runs git in here
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          shopt -s nullglob
          mkdir -p out
          for f in sps/src-tauri/target/release/bundle/rpm/*.rpm; do
            base="$(basename "$f")"
            cp "$f" "out/${base%.rpm}_fedora-42.rpm"
          done
          gh release create "$TAG" --verify-tag --title "sps $TAG" \
            --notes "See the commits since the previous tag for what changed." 2>/dev/null || true
          gh release upload "$TAG" out/* --clobber
