[package]
name = "sps"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.5.57", features = ["derive"] }
memmap2 = "0.9.10"
rmcp = { version = "1.6.0", features = ["schemars", "macros"] }
rusqlite = "0.38.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["parsing", "macros"] }
tokio = { version = "1.52.1", features = ["tracing"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[profile.release]
debug = true
force-frame-pointers = true
